[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-check"
version = "0.1.0"
description = "Validates the JSON specification files below spec/"
license = "MIT-0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "openapi-spec-validator>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
spec-check = "spec_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
