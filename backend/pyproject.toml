[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbm-api"
version = "0.1.0"
description = "Web API: matches, bots and the queue, accounts and administration (spec/web/openapi.json)"
license = "MIT-0"
requires-python = ">=3.12"
# The SDK (package schachbotmanager, for PGN) and sbm-store come from this repository, as for
# the runner.
dependencies = [
  "argon2-cffi>=25.1",
  "flask>=3.1",
  "gunicorn>=25.1",
  "schachbotmanager>=0.1",
  "sbm-store>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "openapi-core>=0.23"]

[project.scripts]
sbm-invite = "sbm_api.invite_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# Test helpers, importable through pytest's pythonpath.
known-local-folder = ["accounts", "bot_uploads", "stored_disciplines", "stored_games"]
