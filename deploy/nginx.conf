# The frontend container: serves the SPA build and passes /api on to the api service.
# TLS ends at the Nginx Proxy Manager in front of this container (E29).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Docker's resolver with a variable: nginx finds api again after the container is recreated.
    # sbm-api is its alias on the internal network; plain "api" could resolve to a container of
    # another stack on local-web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://sbm-api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # File names carry a content hash.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes all load the app.
    location / {
        expires epoch;
        try_files $uri /index.html;
    }
}
