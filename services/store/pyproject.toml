[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbm-store"
version = "0.1.0"
description = "MongoDB access shared by the SchachBotManager services: documents, queue, migrations"
license = "MIT-0"
requires-python = ">=3.12"
dependencies = ["pymongo>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sbm-migrate = "sbm_store.migrate:main"

[project.entry-points.pytest11]
sbm_store = "sbm_store.testing"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
