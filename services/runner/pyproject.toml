[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbm-runner"
version = "0.1.0"
description = "Match runner: takes match jobs from the queue and plays them with the referee"
license = "MIT-0"
requires-python = ">=3.12"
# The SDK (package schachbotmanager) and sbm-store come from this repository; see
# docs/komponenten/match-runner.md for how CI and the image install them.
dependencies = ["schachbotmanager>=0.1", "sbm-store>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sbm-runner = "sbm_runner.cli:main"
sbm-enqueue = "sbm_runner.enqueue_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
