[build-system]
requires = ["scikit-build-core~=1.1", "nanobind~=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "schachbotmanager"
dynamic = ["version"]
description = "Bot SDK for SchachBotManager: chess board, moves and the bot main loop"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/DevTGP/SchachBotManager"
Source = "https://github.com/DevTGP/SchachBotManager/tree/master/sdk/python"

[project.scripts]
sbm-arena = "sbm.arena.cli:main"
sbm-check = "sbm.analysis.cli:main"

[project.optional-dependencies]
# websockets only plays the gateway in the tests of the remote transport.
dev = ["jsonschema>=4.23", "pytest>=8", "ruff>=0.6", "websockets>=15"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/sbm"]

# The SDK carries the version of the core (E36).
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "../core/CMakeLists.txt"
regex = 'project\(sbm_core VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

# Wheels for Windows, Linux and macOS (E64); built from the repository root, which carries the
# core and the spec the tests read.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
archs = ["auto64"]
test-extras = ["dev"]
test-command = "pytest {project}/sdk/python/tests"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
