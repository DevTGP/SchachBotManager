# nsjail configuration of a Python bot (sandbox.md, E86). Fixed protection limits, the same for
# every language (A14); memory, process count and freezing come from the runner's cgroup, not
# from nsjail. The runner adds only the command and, for an uploaded bot, its directory as /bot.

name: "python"
description: "One Python bot process, without network and without anything writable"
mode: ONCE
hostname: "bot"
cwd: "/bot"

# The referee keeps the time; the process ends when the runner kills its cgroup.
time_limit: 0
# Same priority as the runner; nsjail's default of 19 would put bots behind every other service.
nice_level: 0
log_level: WARNING

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# Inside an unprivileged user, outside an id no file and no other process belongs to.
uidmap { inside_id: "1000" outside_id: "99999" count: 1 }
gidmap { inside_id: "1000" outside_id: "99999" count: 1 }

keep_env: false
envar: "PATH=/usr/local/bin"
envar: "PYTHONUTF8=1"
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "PYTHONNOUSERSITE=1"
# No viewer window on the server, even if the bot asks for one (E108).
envar: "SBM_NO_VIEWER=1"

rlimit_as_type: INF
rlimit_cpu_type: INF
rlimit_core: 0
rlimit_fsize: 0
rlimit_nofile: 64

mount_proc: false
mount {
  src: "/opt/sbm/runtimes/python"
  dst: "/"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
}
# No /dev/urandom: Linux lets anyone write to a device file even on a read-only mount, and Python
# gets its randomness from getrandom anyway.
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
  nosuid: true
  noexec: true
}

# The bot's files, read-only and not executable; the runner sets SBM_BOT_DIR for nsjail (the bot
# never sees it) and points it at an empty directory for the reference bots.
mount {
  prefix_src_env: "SBM_BOT_DIR"
  src: ""
  dst: "/bot"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  noexec: true
}

seccomp_policy_file: "/opt/sbm/sandbox/python.policy"
