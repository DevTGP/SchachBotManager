# nsjail configuration of a C# bot and of the C# build tool (sandbox.md, E86, E205). Fixed
# protection limits, the same for every language (A14); memory, process count and freezing come
# from the runner's cgroup, not from nsjail. The runner adds only the command and, for an uploaded
# bot, its directory as /bot and its compiled program as /program.

name: "csharp"
description: "One .NET process, without network and without anything writable"
mode: ONCE
hostname: "bot"
cwd: "/bot"

# The referee keeps the time; the process ends when the runner kills its cgroup.
time_limit: 0
# Same priority as the runner; nsjail's default of 19 would put bots behind every other service.
nice_level: 0
log_level: WARNING

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# Inside an unprivileged user, outside an id no file and no other process belongs to.
uidmap { inside_id: "1000" outside_id: "99999" count: 1 }
gidmap { inside_id: "1000" outside_id: "99999" count: 1 }

keep_env: false
envar: "PATH=/usr/share/dotnet"
envar: "DOTNET_ROOT=/usr/share/dotnet"
envar: "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1"
envar: "DOTNET_CLI_TELEMETRY_OPTOUT=1"
# No diagnostic pipes and no memory dumps.
envar: "DOTNET_EnableDiagnostics=0"
# Without /proc and /sys .NET does not see the cgroup's memory limit (limits.py, 1024 MiB): keep
# the heap below it, so that the GC collects instead of the cgroup killing the process.
envar: "DOTNET_GCHeapHardLimit=0x30000000"
envar: "SBM_DATA_DIR=/bot/data"
envar: "SBM_PROGRAM=/program/bot.dll"
# No viewer window on the server, even if the bot asks for one (E108).
envar: "SBM_NO_VIEWER=1"

rlimit_as_type: INF
rlimit_cpu_type: INF
rlimit_core: 0
rlimit_fsize: 0
rlimit_nofile: 256

mount_proc: false
mount {
  src: "/opt/sbm/runtimes/csharp"
  dst: "/"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
}
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
  nosuid: true
  noexec: true
}
# .NET reads its randomness (Guid.NewGuid, RandomNumberGenerator, Roslyn) from /dev/urandom, not
# from getrandom. Linux lets anyone write to a device file even on a read-only mount, so the
# seccomp policy opens files only for reading (csharp.policy).
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: false
  nosuid: true
  noexec: true
}

# The bot's files, read-only and not executable; the runner sets SBM_BOT_DIR for nsjail (the bot
# never sees it); the build tool reads the sources from here.
mount {
  prefix_src_env: "SBM_BOT_DIR"
  src: ""
  dst: "/bot"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  noexec: true
}

# The program the build tool compiled at verification (E204), next to the files instead of among
# them, so that no upload can name it; the launcher reads it into memory, hence noexec. Empty for
# the build tool itself.
mount {
  prefix_src_env: "SBM_PROGRAM_DIR"
  src: ""
  dst: "/program"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  noexec: true
}

seccomp_policy_file: "/opt/sbm/sandbox/csharp.policy"
