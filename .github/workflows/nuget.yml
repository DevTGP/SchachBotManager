name: NuGet

# Builds the NuGet package SchachBotManager of the C# SDK (E199) with the shared core and the
# viewer program (E206) for every platform under runtimes/<rid>/native, tests it with the template templates/csharp on every
# platform and keeps it as a workflow artifact (E200). A version tag such as v0.4.0 also
# publishes it on nuget.org through trusted publishing; nuget.org knows this file and the
# environment nuget as the only allowed publisher. Like wheels.yml it runs only for a version
# tag or by hand (E79); the CI tests the C# SDK on every push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        # Native runners for every architecture, as in wheels.yml.
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the core as shared library
        shell: bash
        run: .github/scripts/build-core-shared.sh ${{ matrix.rid }} runtimes

      - name: Build the viewer program
        shell: bash
        run: .github/scripts/build-viewer.sh ${{ matrix.rid }} runtimes

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: runtimes
          if-no-files-found: error

  pack:
    name: Package
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: runtimes
          merge-multiple: true

      - name: Pack
        run: dotnet pack sdk/csharp/src/Sbm -c Release -o nuget "-p:SbmRuntimesDir=$PWD/runtimes"

      - name: Check the native files in the package
        run: |
          contents=$(unzip -l nuget/*.nupkg)
          echo "$contents"
          for file in linux-x64/native/libsbm.so linux-arm64/native/libsbm.so \
            win-x64/native/sbm.dll osx-x64/native/libsbm.dylib osx-arm64/native/libsbm.dylib \
            linux-x64/native/sbm-viewer linux-arm64/native/sbm-viewer \
            win-x64/native/sbm-viewer.exe osx-x64/native/sbm-viewer osx-arm64/native/sbm-viewer \
            win-x64/native/sbm-viewer-licenses/SDL3-LICENSE.txt; do
            if ! grep -q "runtimes/$file" <<<"$contents"; then
              echo "::error::the package lacks runtimes/$file"
              exit 1
            fi
          done

      # The version comes from sdk/core/CMakeLists.txt (E36); the tag only triggers the upload.
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package="nuget/SchachBotManager.${GITHUB_REF_NAME#v}.nupkg"
          if [ ! -f "$package" ]; then
            echo "::error::$package is missing; found $(ls nuget)"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: nuget/*.nupkg
          if-no-files-found: error

  test:
    name: Template (${{ matrix.os }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The arena comes from the Python SDK of the same commit.
      - name: Install the Python SDK for the arena
        run: pip install -C cmake.define.SBM_VIEWER=OFF ./sdk/python pytest

      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: feed

      - name: Build the template against the package and play it
        env:
          SBM_NUGET_SOURCE: ${{ github.workspace }}/feed
          SBM_REQUIRE_VIEWER: "1"
        run: pytest sdk/csharp/tests/cross/test_template.py

  publish:
    name: Publish on nuget.org
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack, test]
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/SchachBotManager
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: nuget

      # Exchanges the OIDC token of this job for a short-lived API key; NUGET_USER is the
      # profile name on nuget.org.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >-
          dotnet nuget push nuget/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
