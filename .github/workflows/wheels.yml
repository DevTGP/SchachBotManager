name: Wheels

# Builds and tests the Python SDK wheels for every platform (E64) and keeps them as workflow
# artifacts. A version tag such as v0.1.0 also publishes them on PyPI through trusted publishing
# (E70); PyPI knows this file and the environment pypi as the only allowed publisher.
# It runs only for a version tag or by hand, not for every push (E79); the CI tests the SDK on
# every platform anyway.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Native runners for every architecture: x86-64 and arm64 each on Linux and macOS.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v4.3.0
        with:
          package-dir: sdk/python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish on PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/schachbotmanager
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      # The version comes from sdk/core/CMakeLists.txt (E36); the tag only triggers the upload.
      - name: Check that the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in
              "schachbotmanager-$version-"*) ;;
              *) echo "::error::$wheel does not carry version $version"; exit 1 ;;
            esac
          done
          ls dist

      - uses: pypa/gh-action-pypi-publish@release/v1
