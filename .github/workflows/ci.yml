name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install spec-check
        run: pip install -e "tools/spec-check[dev]"

      - name: Lint spec-check
        run: |
          ruff check tools/spec-check
          ruff format --check tools/spec-check

      - name: Test spec-check
        run: pytest tools/spec-check

      - name: Validate spec
        run: spec-check spec
