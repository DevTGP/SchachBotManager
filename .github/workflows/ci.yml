name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each job below runs only when its part of the repository changed (E79); a manual run or a
  # change to the CI itself runs all of them.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      spec: ${{ steps.areas.outputs.spec }}
      testvectors: ${{ steps.areas.outputs.testvectors }}
      core_headers: ${{ steps.areas.outputs.core_headers }}
      core: ${{ steps.areas.outputs.core }}
      python: ${{ steps.areas.outputs.python }}
      services: ${{ steps.areas.outputs.services }}
      frontend: ${{ steps.areas.outputs.frontend }}
      native_format: ${{ steps.areas.outputs.native_format }}
    steps:
      # The whole history without file contents, so the base commit of the push is there.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      # A push compares with the last commit of its branch that passed CI, so a push after a red
      # run tests everything since the green one and the deploy never gets untested code.
      - name: Find the changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          base=$PR_BASE
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
          fi
          echo "base: ${base:-none}" >&2
          bash .github/scripts/changed-areas.sh "$base" | tee -a "$GITHUB_OUTPUT"

  spec:
    name: Spec
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install spec-check
        run: pip install -e "tools/spec-check[dev]"

      - name: Lint spec-check
        run: |
          ruff check tools/spec-check
          ruff format --check tools/spec-check

      - name: Test spec-check
        run: pytest tools/spec-check

      - name: Validate spec
        run: spec-check spec

  testvectors:
    name: Test vectors
    needs: changes
    if: needs.changes.outputs.testvectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install testvector-gen
        run: pip install -e "tools/testvector-gen[dev]"

      - name: Lint testvector-gen
        run: |
          ruff check tools/testvector-gen
          ruff format --check tools/testvector-gen

      - name: Test testvector-gen
        run: pytest tools/testvector-gen

      - name: Check generated files and recount fast perft vectors
        run: testvector-gen spec --check --perft fast

  core-headers:
    name: Core headers
    needs: changes
    if: needs.changes.outputs.core_headers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile as C11
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -Isdk/core/include sdk/core/tests/header_check.c

      - name: Compile as C++20
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -Isdk/core/include sdk/core/tests/header_check.cpp

  core:
    name: Core (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S sdk/core -B build/core -DCMAKE_BUILD_TYPE=Release -DSBM_SLOW_TESTS=ON

      - name: Build
        run: cmake --build build/core --config Release --parallel

      - name: Test (unit tests, all vectors, slow perft included)
        run: ctest --test-dir build/core -C Release --output-on-failure

  python:
    name: Python SDK (${{ matrix.os }}, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # The annotation plugin reports each failing test as an annotation of the run, which is
      # readable without signing in, unlike the job logs.
      - name: Build and install the package with the core
        run: pip install "./sdk/python[dev]" pytest-github-actions-annotate-failures==0.4.2

      - name: Lint
        run: |
          ruff check sdk/python templates/python
          ruff format --check sdk/python templates/python

      - name: Test (API vectors, constants, errors, objects, template)
        run: pytest sdk/python

  services:
    name: Store, runner and web API
    needs: changes
    if: needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      SBM_TEST_MONGO_URI: mongodb://localhost:27017
      # Without this the database tests would be skipped instead of failing.
      SBM_REQUIRE_MONGO: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the SDK and the services
        run: >-
          pip install ./sdk/python ./services/store "./services/runner[dev]" "./backend[dev]"
          pytest-github-actions-annotate-failures==0.4.2

      - name: Lint
        run: |
          ruff check services/store services/runner backend
          ruff format --check services/store services/runner backend

      - name: Test store
        run: pytest services/store

      - name: Test runner (real games between the reference bots)
        run: pytest services/runner

      - name: Test web API (responses checked against spec/web/openapi.json)
        run: pytest backend

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: API types match spec/web/openapi.json
        run: npm run api-types:check

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Test
        run: npm test

      - name: Build (type check and bundle)
        run: npm run build

  native-format:
    name: Native format
    needs: changes
    if: needs.changes.outputs.native_format == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install clang-format==19.1.7

      - name: Check formatting
        run: >
          find sdk/core/include sdk/core/src sdk/core/tests sdk/python/src/native
          \( -name '*.h' -o -name '*.c' -o -name '*.hpp' -o -name '*.cpp' \)
          -exec clang-format --dry-run --Werror {} +
