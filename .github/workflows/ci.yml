name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install spec-check
        run: pip install -e "tools/spec-check[dev]"

      - name: Lint spec-check
        run: |
          ruff check tools/spec-check
          ruff format --check tools/spec-check

      - name: Test spec-check
        run: pytest tools/spec-check

      - name: Validate spec
        run: spec-check spec

  testvectors:
    name: Test vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install testvector-gen
        run: pip install -e "tools/testvector-gen[dev]"

      - name: Lint testvector-gen
        run: |
          ruff check tools/testvector-gen
          ruff format --check tools/testvector-gen

      - name: Test testvector-gen
        run: pytest tools/testvector-gen

      - name: Check generated files and recount fast perft vectors
        run: testvector-gen spec --check --perft fast

  core-headers:
    name: Core headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile as C11
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -Isdk/core/include sdk/core/tests/header_check.c

      - name: Compile as C++20
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -Isdk/core/include sdk/core/tests/header_check.cpp

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S sdk/core -B build/core -DCMAKE_BUILD_TYPE=Release -DSBM_SLOW_TESTS=ON

      - name: Build
        run: cmake --build build/core --config Release --parallel

      - name: Test (unit tests, all vectors, slow perft included)
        run: ctest --test-dir build/core -C Release --output-on-failure

  python:
    name: Python SDK (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build and install the package with the core
        run: pip install "./sdk/python[dev]"

      - name: Lint
        run: |
          ruff check sdk/python
          ruff format --check sdk/python

      - name: Test (API vectors, constants, errors, objects)
        run: pytest sdk/python

  native-format:
    name: Native format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install clang-format==19.1.7

      - name: Check formatting
        run: >
          find sdk/core/include sdk/core/src sdk/core/tests sdk/python/src/native
          -name '*.h' -o -name '*.c' -o -name '*.hpp' -o -name '*.cpp'
          | xargs clang-format --dry-run --Werror
